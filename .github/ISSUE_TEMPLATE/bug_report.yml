name: Bug report
description: Report a reproducible software problem with sanitized evidence
body:
  - type: textarea
    id: environment
    attributes:
      label: OS and tool versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Exact command and reproduction steps
      description: Remove secrets, private hosts, account IDs and user content.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private data and credentials and this is not a vulnerability report.
          required: true
